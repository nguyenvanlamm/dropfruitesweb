name: General Feedback
description: Questions, praise, your best score, or anything else
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what's on your mind.
    validations:
      required: true

  - type: input
    id: best-score
    attributes:
      label: Best score (optional)
      description: Bragging rights welcome.
    validations:
      required: false
