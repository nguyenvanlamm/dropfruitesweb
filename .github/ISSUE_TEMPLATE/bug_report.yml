name: Bug Report
description: Something in Fruit Mischief is broken or behaves strangely
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The more detail you give, the faster it gets fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
      placeholder: "Two lychees in the same basket touched but didn't merge..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What were you doing right before it happened?
      placeholder: |
        1. Held Magnet and Cleaver
        2. Used Cleaver on a Starfruit
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the game?
      options:
        - Physics / merging
        - Blessings
        - Item shop / purchases
        - Sound
        - Score / best score
        - Something else
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
      placeholder: "iPhone 15, iOS 26.0"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → Apps → Fruit Mischief, or the App Store page
      placeholder: "1.0.0"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Drop images or a short screen recording here if they help.
    validations:
      required: false
